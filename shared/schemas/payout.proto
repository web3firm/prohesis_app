syntax = "proto3";

package prohesis;

message Payout {
  string market_id = 1;
  string user_address = 2;
  uint32 outcome = 3;
  string amount = 4;
  int64 timestamp = 5;
}

message RedeemRequest {
  string market_id = 1;
  string user_address = 2;
}

message RedeemResponse {
  bool success = 1;
  string transaction_hash = 2;
  string amount = 3;
}
